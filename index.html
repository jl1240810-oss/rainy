<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨夜便利店 · 微缩街角</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0e14; }
    canvas { display: block; }
    #err {
      position: fixed; top: 10px; left: 10px; right: 10px;
      color: #ff7777; background: rgba(0,0,0,0.7);
      font: 14px/1.5 monospace; padding: 12px; white-space: pre-wrap;
      display: none; z-index: 999; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="err"></div>

  <!-- 使用经典全局脚本方式，避免 importmap 兼容问题 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
  (function () {
    try {
      if (typeof THREE === 'undefined') {
        throw new Error('Three.js 未能加载，请检查网络是否能访问 cdn.jsdelivr.net');
      }

      // ========== 基础 ==========
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0e14);
      scene.fog = new THREE.Fog(0x0b0e14, 25, 65);

      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
      camera.position.set(14, 9, 20);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
      if ('toneMapping' in renderer) {
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
      }
      document.body.appendChild(renderer.domElement);

      // ========== 控制器 ==========
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 2.5, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2.15;
      controls.minDistance = 6;
      controls.maxDistance = 40;
      controls.update();

      // ========== 灯光 ==========
      scene.add(new THREE.AmbientLight(0x3f4a66, 0.6));

      const street1 = new THREE.PointLight(0x7d9cd6, 0.9, 32);
      street1.position.set(5, 8, 5);
      scene.add(street1);

      const street2 = new THREE.PointLight(0x7d9cd6, 0.6, 25);
      street2.position.set(-6, 7, -4);
      scene.add(street2);

      const store1 = new THREE.PointLight(0xffdd99, 1.3, 16);
      store1.position.set(0, 4, 1.5);
      scene.add(store1);

      const store2 = new THREE.PointLight(0xffaa66, 1.0, 12);
      store2.position.set(-2, 4, -1);
      scene.add(store2);

      const store3 = new THREE.PointLight(0xffaa66, 1.0, 12);
      store3.position.set(2.5, 4, -1);
      scene.add(store3);

      const signLight = new THREE.PointLight(0xffaa55, 0.8, 10);
      signLight.position.set(1.5, 4.5, 3.2);
      scene.add(signLight);

      const fill = new THREE.DirectionalLight(0xccddff, 0.25);
      fill.position.set(2, 5, 6);
      scene.add(fill);

      const rim = new THREE.DirectionalLight(0x556688, 0.4);
      rim.position.set(-5, 5, -8);
      scene.add(rim);

      // ========== 组装动画管理 ==========
      const appearList = [];
      const ASSEMBLY_DURATION = 4.0;
      const assemblyStart = performance.now() / 1000;

      function registerAppear(obj, delay, duration, dropHeight) {
        obj.userData.ap = {
          delay: delay, duration: duration, drop: dropHeight,
          oy: obj.position.y,
          os: obj.scale.clone(),
          orx: obj.rotation.x, ory: obj.rotation.y, orz: obj.rotation.z
        };
        obj.position.y = obj.userData.ap.oy - dropHeight;
        obj.scale.set(0.001, 0.001, 0.001);
        obj.visible = false;
        appearList.push(obj);
      }

      function updateAssembly(t) {
        for (const obj of appearList) {
          const a = obj.userData.ap;
          if (!a) continue;
          let p = (t - a.delay / ASSEMBLY_DURATION) / (a.duration / ASSEMBLY_DURATION);
          p = Math.max(0, Math.min(1, p));
          const e = 1 - Math.pow(1 - p, 3);
          obj.position.y = a.oy - a.drop * (1 - e);
          obj.scale.set(a.os.x * e, a.os.y * e, a.os.z * e);
          obj.rotation.set(a.orx, a.ory, a.orz);
          obj.visible = e > 0.001;
        }
      }

      // ========== 底座 ==========
      const baseGroup = new THREE.Group();
      scene.add(baseGroup);

      const baseMesh = new THREE.Mesh(
        new THREE.BoxGeometry(14, 0.3, 14),
        new THREE.MeshStandardMaterial({
          color: 0x1a1e28, roughness: 0.35, metalness: 0.2,
          emissive: 0x0a0c10, emissiveIntensity: 0.2
        })
      );
      baseMesh.position.set(0, -0.15, 0);
      baseMesh.receiveShadow = true;
      baseMesh.castShadow = true;
      baseGroup.add(baseMesh);

      const edgePts = [
        [-7, 0.02, -7], [7, 0.02, -7], [7, 0.02, 7], [-7, 0.02, 7], [-7, 0.02, -7]
      ].map(p => new THREE.Vector3(p[0], p[1], p[2]));
      baseGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(edgePts),
        new THREE.LineBasicMaterial({ color: 0x3a4a6a })
      ));

      registerAppear(baseGroup, 0.0, 1.0, 3.0);
      baseGroup.position.y = -3;

      // ========== 路面细节 ==========
      const road = new THREE.Group();
      scene.add(road);

      const stripeMat = new THREE.MeshStandardMaterial({
        color: 0xaaccff, emissive: 0x224466, emissiveIntensity: 0.3,
        transparent: true, opacity: 0.35, roughness: 0.2
      });
      for (let i = -1; i <= 1; i++) {
        const s = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.02, 0.25), stripeMat);
        s.position.set(i * 2.5, 0.02, 3.5);
        s.rotation.y = 0.2;
        road.add(s);
      }

      const drain = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.05, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.7, metalness: 0.5 })
      );
      drain.position.set(4.5, 0.03, -4);
      road.add(drain);

      const puddleMat = new THREE.MeshStandardMaterial({
        color: 0x88aadd, emissive: 0x112233, emissiveIntensity: 0.6,
        transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.8
      });
      [[-3, 2.5], [2.5, -2], [4, 4], [-4.5, -3], [0.5, 4.5]].forEach(([x, z]) => {
        const p = new THREE.Mesh(new THREE.CircleGeometry(0.7 + Math.random() * 0.5, 8), puddleMat);
        p.position.set(x, 0.02, z);
        p.rotation.x = -Math.PI / 2;
        road.add(p);
      });

      registerAppear(road, 0.2, 0.6, 0.6);

      // ========== 便利店建筑 ==========
      const store = new THREE.Group();
      scene.add(store);

      const wallMat = new THREE.MeshStandardMaterial({
        color: 0xdddddd, roughness: 0.5, emissive: 0x222222, emissiveIntensity: 0.1
      });
      const wallDark = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.6 });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0xaaccff, transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.1,
        emissive: 0x112233, emissiveIntensity: 0.3, side: THREE.DoubleSide
      });

      function addPart(mesh, delay) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        store.add(mesh);
        registerAppear(mesh, delay, 0.6, 1.2);
        return mesh;
      }

      addPart(new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 0.3), wallDark), 1.0).position.set(0, 1.75, -2.5);
      addPart(new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.5, 5), wallMat), 1.1).position.set(-3, 1.75, 0);
      addPart(new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.5, 5), wallMat), 1.2).position.set(3, 1.75, 0);
      addPart(new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.2, 5.2),
        new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 })), 1.3).position.set(0, 3.6, 0);
      addPart(new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.8, 0.1), glassMat), 1.4).position.set(-1.7, 1.7, 2.45);

      // 自动门
      const doorGroup = new THREE.Group();
      const doorGlass = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 0.1), glassMat);
      doorGlass.position.set(0, 1.5, 0);
      doorGroup.add(doorGlass);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.6 });
      const fTop = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 0.15), frameMat);
      fTop.position.set(0, 2.85, 0.02);
      doorGroup.add(fTop);
      const fL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.7, 0.15), frameMat);
      fL.position.set(-0.95, 1.45, 0.02);
      doorGroup.add(fL);
      const fR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.7, 0.15), frameMat);
      fR.position.set(0.95, 1.45, 0.02);
      doorGroup.add(fR);
      doorGroup.position.set(1.5, 0, 2.45);
      store.add(doorGroup);
      registerAppear(doorGroup, 1.5, 0.6, 1.2);

      addPart(new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 0.3), wallMat), 1.6).position.set(0, 0.15, 2.45);

      const divMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
      addPart(new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.8, 0.12), divMat), 1.7).position.set(-0.6, 1.7, 2.46);
      addPart(new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.8, 0.12), divMat), 1.75).position.set(0.2, 1.7, 2.46);

      // 招牌
      const signBoardMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, emissive: 0xffaa55, emissiveIntensity: 1.2, roughness: 0.2
      });
      addPart(new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.7, 0.3), signBoardMat), 1.85).position.set(0, 3.95, 2.4);

      const stripeMat2 = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff4400, emissiveIntensity: 1.0 });
      for (let i = 0; i < 3; i++) {
        addPart(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.05), stripeMat2), 1.95 + i * 0.05)
          .position.set(-1.2 + i * 1.2, 3.95, 2.56);
      }

      addPart(new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0xffeeaa, emissive: 0xffaa33, emissiveIntensity: 1.5 })), 2.1)
        .position.set(1.5, 4.3, 2.3);

      // 雨棚
      addPart(new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.1, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.6 })), 2.15).position.set(0, 3.15, 3.0);

      const pillarMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 });
      addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.1, 6), pillarMat), 2.2).position.set(-2.8, 1.55, 3.4);
      addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.1, 6), pillarMat), 2.25).position.set(2.8, 1.55, 3.4);

      // ========== 店内 ==========
      const inside = new THREE.Group();
      store.add(inside);

      const floorMat = new THREE.MeshStandardMaterial({ color: 0xccbbaa, roughness: 0.8, emissive: 0x443322, emissiveIntensity: 0.2 });
      const inFloor = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.1, 4.8), floorMat);
      inFloor.position.set(0, 0.05, 0);
      inFloor.receiveShadow = true;
      inside.add(inFloor);

      const inWall = new THREE.Mesh(new THREE.BoxGeometry(5.8, 3.2, 0.1),
        new THREE.MeshStandardMaterial({ color: 0xeeddcc, roughness: 0.8 }));
      inWall.position.set(0, 1.7, -2.4);
      inside.add(inWall);

      const shelfMat = new THREE.MeshStandardMaterial({ color: 0xbbaa99, roughness: 0.7 });
      const shelfColors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff];

      const sh1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 2.5), shelfMat);
      sh1.position.set(-2.2, 0.9, -0.5);
      sh1.castShadow = true;
      inside.add(sh1);

      for (let i = 0; i < 12; i++) {
        const c = shelfColors[i % shelfColors.length];
        const item = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.15),
          new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.3 }));
        item.position.set(-2.2 + (Math.random() - 0.5) * 0.5, 0.4 + Math.floor(i / 4) * 0.5, -1.2 + (i % 4) * 0.7);
        item.castShadow = true;
        inside.add(item);
      }

      const sh2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 2.5), shelfMat);
      sh2.position.set(2.2, 0.9, -0.5);
      sh2.castShadow = true;
      inside.add(sh2);

      for (let i = 0; i < 12; i++) {
        const c = shelfColors[(i + 2) % shelfColors.length];
        const item = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.15),
          new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.3 }));
        item.position.set(2.2 + (Math.random() - 0.5) * 0.5, 0.4 + Math.floor(i / 4) * 0.5, -1.2 + (i % 4) * 0.7);
        item.castShadow = true;
        inside.add(item);
      }

      const counter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.9, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.6 }));
      counter.position.set(0, 0.45, -1.6);
      counter.castShadow = true;
      inside.add(counter);

      const reg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.5 }));
      reg.position.set(0.5, 1.0, -1.6);
      reg.castShadow = true;
      inside.add(reg);

      const coffee = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0x442200, emissiveIntensity: 0.5 }));
      coffee.position.set(-0.6, 0.9, -1.5);
      coffee.castShadow = true;
      inside.add(coffee);

      const magRack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.3),
        new THREE.MeshStandardMaterial({ color: 0xcccccc }));
      magRack.position.set(-1.2, 0.5, 1.8);
      magRack.castShadow = true;
      inside.add(magRack);

      for (let i = 0; i < 4; i++) {
        const c = shelfColors[i % shelfColors.length];
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.08),
          new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.2 }));
        mag.position.set(-1.6 + i * 0.3, 0.65, 1.8);
        mag.rotation.z = 0.1;
        mag.castShadow = true;
        inside.add(mag);
      }

      const cooler = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.0, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x88aacc, emissive: 0x224466, emissiveIntensity: 0.6 }));
      cooler.position.set(-1.2, 1.0, -2.2);
      cooler.castShadow = true;
      inside.add(cooler);

      for (let i = 0; i < 6; i++) {
        const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 6),
          new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xaaaaaa, emissiveIntensity: 0.5 }));
        bottle.position.set(-1.8 + i * 0.24, 0.7, -2.05);
        bottle.castShadow = true;
        inside.add(bottle);
      }

      const hot = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.5),
        new THREE.MeshStandardMaterial({ color: 0xaa8866, emissive: 0x552200, emissiveIntensity: 0.6 }));
      hot.position.set(1.2, 0.9, -1.2);
      hot.castShadow = true;
      inside.add(hot);

      const lampMat = new THREE.MeshStandardMaterial({ color: 0xffeeaa, emissive: 0xffcc66, emissiveIntensity: 2.0 });
      const lamp1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), lampMat);
      lamp1.position.set(-1.5, 3.0, 0);
      inside.add(lamp1);
      const lamp2 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), lampMat);
      lamp2.position.set(1.5, 3.0, 0);
      inside.add(lamp2);

      // 店内元素逐个出现
      inside.children.forEach((child, idx) => {
        registerAppear(child, 1.7 + idx * 0.03, 0.5, 0.7);
      });

      // ========== 街道元素 ==========
      function addStreet(mesh, delay, drop) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        registerAppear(mesh, delay, 0.6, drop);
        return mesh;
      }

      // 自动贩卖机
      const vm = new THREE.Group();
      vm.add(new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.8),
        new THREE.MeshStandardMaterial({ color: 0xcc3333, emissive: 0x441111, emissiveIntensity: 0.6, roughness: 0.4 })));
      vm.children[0].position.y = 1.1;
      vm.children[0].castShadow = true;
      const vmPanel = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.1),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffdd88, emissiveIntensity: 1.0 }));
      vmPanel.position.set(0, 1.5, 0.45);
      vm.add(vmPanel);
      vm.position.set(4.2, 0, 1.5);
      vm.rotation.y = -0.2;
      scene.add(vm);
      registerAppear(vm, 2.3, 0.6, 1.5);

      // 自行车
      const bike = new THREE.Group();
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x3366aa, roughness: 0.5 });
      const wheelGeo = new THREE.TorusGeometry(0.35, 0.05, 8, 16);
      const w1 = new THREE.Mesh(wheelGeo, wheelMat);
      w1.position.set(0.5, 0.35, 0);
      w1.rotation.x = Math.PI / 2;
      bike.add(w1);
      const w2 = new THREE.Mesh(wheelGeo, wheelMat);
      w2.position.set(-0.5, 0.35, 0);
      w2.rotation.x = Math.PI / 2;
      bike.add(w2);
      const fb = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.08), frameMat);
      fb.position.set(0, 0.5, 0);
      bike.add(fb);
      const fb2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.08), frameMat);
      fb2.position.set(0.2, 0.6, 0);
      bike.add(fb2);
      bike.position.set(-4.5, 0, 2.8);
      bike.rotation.y = 0.5;
      scene.add(bike);
      registerAppear(bike, 2.5, 0.6, 1.2);

      // 路灯
      const lamp = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 5.0, 8),
        new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.7 }));
      pole.position.y = 2.5;
      lamp.add(pole);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x333333 }));
      head.position.set(0, 5.0, 0.2);
      lamp.add(head);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6),
        new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: 0xffeeaa, emissiveIntensity: 2.0 }));
      bulb.position.set(0, 5.0, 0.2);
      lamp.add(bulb);
      lamp.position.set(-5.5, 0, -4.5);
      scene.add(lamp);
      registerAppear(lamp, 2.0, 0.7, 2.0);

      // 电线杆
      const upole = new THREE.Group();
      const up = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 6.0, 6),
        new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.6 }));
      up.position.y = 3.0;
      upole.add(up);
      const cm = new THREE.MeshStandardMaterial({ color: 0x555555 });
      const c1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.08), cm);
      c1.position.y = 5.2;
      upole.add(c1);
      const c2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.08), cm);
      c2.position.y = 4.5;
      upole.add(c2);
      upole.position.set(5.8, 0, -3.5);
      scene.add(upole);
      registerAppear(upole, 2.8, 0.7, 2.0);

      // 电线
      const wireCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(5.8, 5.2, -3.5),
        new THREE.Vector3(3.5, 4.8, -2.0),
        new THREE.Vector3(0, 4.5, -1.0),
        new THREE.Vector3(-2.5, 4.7, 1.0),
        new THREE.Vector3(-5.5, 5.0, 2.0)
      ]);
      const wire = new THREE.Mesh(
        new THREE.TubeGeometry(wireCurve, 20, 0.03, 6, false),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      wire.castShadow = true;
      scene.add(wire);
      registerAppear(wire, 3.3, 0.6, 1.0);

      // 路牌
      const sp = addStreet(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.5, 6),
        new THREE.MeshStandardMaterial({ color: 0xcccccc })), 2.4, 1.2);
      sp.position.set(-2.5, 1.25, 4.2);

      const splate = addStreet(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.4, 0.05),
        new THREE.MeshStandardMaterial({ color: 0x4477aa, emissive: 0x112233, emissiveIntensity: 0.3 })), 2.55, 0.8);
      splate.position.set(-2.5, 2.3, 4.2);

      // 垃圾桶
      const trash = addStreet(new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.7, 8),
        new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.6 })), 2.35, 1.0);
