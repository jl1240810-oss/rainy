<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>雨夜のコンビニ</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0f22;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .caption {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #aab8e0;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px #1e2b5a;
      pointer-events: none;
      z-index: 10;
      opacity: 0.8;
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="caption">雨夜のコンビニ • コンビニの灯り</div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    (function () {
      // --- 初期化 ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f22);
      scene.fog = new THREE.FogExp2(0x0b0f22, 0.035);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(7, 5, 14);
      camera.lookAt(0, 1.5, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // コントロール
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.6;
      controls.target.set(0, 1.8, 0);
      controls.maxPolarAngle = Math.PI / 2.3;
      controls.enableZoom = true;
      controls.zoomSpeed = 0.8;

      // --- ライティング ---
      scene.add(new THREE.AmbientLight(0x404a7a, 0.6));

      const moonLight = new THREE.DirectionalLight(0x9db4ff, 0.25);
      moonLight.position.set(-5, 12, 8);
      scene.add(moonLight);

      const storeLight = new THREE.PointLight(0xffe6b0, 1.8, 20, 2);
      storeLight.position.set(0, 2.5, 1.5);
      scene.add(storeLight);

      const signLight = new THREE.PointLight(0xc8e2ff, 1.2, 15, 2);
      signLight.position.set(0, 3.8, -2.0);
      scene.add(signLight);

      const streetLight = new THREE.PointLight(0xffaa66, 0.8, 20, 2);
      streetLight.position.set(4, 3, -4);
      scene.add(streetLight);

      const coolFill = new THREE.PointLight(0x6688cc, 0.5, 25, 2);
      coolFill.position.set(-5, 2, 5);
      scene.add(coolFill);

      // --- 地面 ---
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(18, 32),
        new THREE.MeshStandardMaterial({
          color: 0x1a1e2e,
          roughness: 0.25,
          metalness: 0.6,
          emissive: new THREE.Color(0x05070f),
        })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const gridHelper = new THREE.GridHelper(30, 20, 0x4a5a8a, 0x2a3350);
      gridHelper.position.y = 0.01;
      scene.add(gridHelper);

      // 水たまり
      const puddleMat = new THREE.MeshStandardMaterial({
        color: 0x2a3355,
        emissive: new THREE.Color(0x111a33),
        roughness: 0.1,
        metalness: 0.9,
        transparent: true,
        opacity: 0.6,
      });
      for (let i = 0; i < 8; i++) {
        const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.3 + Math.random() * 0.7, 12), puddleMat);
        puddle.rotation.x = -Math.PI / 2;
        puddle.position.set((Math.random() - 0.5) * 10, 0.02, (Math.random() - 0.5) * 10 + 3);
        puddle.scale.set(1, 0.6, 1);
        scene.add(puddle);
      }

      // --- コンビニの建物 ---
      const buildingGroup = new THREE.Group();

      const shopBody = new THREE.Mesh(
        new THREE.BoxGeometry(7, 3.2, 4.5),
        new THREE.MeshStandardMaterial({ color: 0x2a2f45, roughness: 0.5, metalness: 0.2 })
      );
      shopBody.position.set(0, 1.6, -0.5);
      buildingGroup.add(shopBody);

      const glassMat = new THREE.MeshStandardMaterial({
        color: 0xc8e0ff,
        emissive: new THREE.Color(0x4466aa),
        transparent: true,
        opacity: 0.45,
        roughness: 0.2,
        metalness: 0.8,
      });
      const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(6.2, 2.0, 0.2), glassMat);
      frontGlass.position.set(0, 2.0, 1.55);
      buildingGroup.add(frontGlass);

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x8899bb, emissive: new THREE.Color(0x112244) });
      for (let i = -2; i <= 2; i++) {
        if (i === 0) continue;
        const vFrame = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.0, 0.1), frameMat);
        vFrame.position.set(i * 1.4, 2.0, 1.56);
        buildingGroup.add(vFrame);
      }
      const hFrame = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.06, 0.1), frameMat);
      hFrame.position.set(0, 2.9, 1.56);
      buildingGroup.add(hFrame);
      const hFrame2 = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.06, 0.1), frameMat);
      hFrame2.position.set(0, 1.1, 1.56);
      buildingGroup.add(hFrame2);

      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(7.4, 0.2, 4.8),
        new THREE.MeshStandardMaterial({ color: 0x1a1e30, roughness: 0.7 })
      );
      roof.position.set(0, 3.3, -0.5);
      buildingGroup.add(roof);

      const signBoardMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: new THREE.Color(0xaaccff),
        emissiveIntensity: 0.9,
        roughness: 0.3,
      });
      const signBoard = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 0.15), signBoardMat);
      signBoard.position.set(0, 3.8, -2.2);
      buildingGroup.add(signBoard);

      const signRim = new THREE.Mesh(
        new THREE.BoxGeometry(4.7, 1.0, 0.1),
        new THREE.MeshStandardMaterial({ color: 0x6688bb, emissive: new THREE.Color(0x224466) })
      );
      signRim.position.set(0, 3.8, -2.18);
      buildingGroup.add(signRim);

      const signText = new THREE.Mesh(
        new THREE.BoxGeometry(3.6, 0.5, 0.05),
        new THREE.MeshStandardMaterial({ color: 0x0a1428, emissive: new THREE.Color(0x88aaff), emissiveIntensity: 0.4 })
      );
      signText.position.set(0, 3.8, -2.12);
      buildingGroup.add(signText);

      const vending = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.6, 0.7),
        new THREE.MeshStandardMaterial({ color: 0xcc3333, emissive: new THREE.Color(0x772222), emissiveIntensity: 0.4, roughness: 0.4 })
      );
      vending.position.set(3.2, 0.8, 2.0);
      buildingGroup.add(vending);

      const vendingLight = new THREE.PointLight(0xff8866, 0.6, 6, 2);
      vendingLight.position.set(3.2, 1.2, 2.4);
      scene.add(vendingLight);

      const pot = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.25, 0.4, 8),
        new THREE.MeshStandardMaterial({ color: 0x5a4a3a })
      );
      pot.position.set(-3.2, 0.2, 2.3);
      buildingGroup.add(pot);

      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(0.5, 0.9, 6),
        new THREE.MeshStandardMaterial({ color: 0x2a5a3a })
      );
      leaves.position.set(-3.2, 0.8, 2.3);
      buildingGroup.add(leaves);

      scene.add(buildingGroup);

      // --- 雨 ---
      const rainCount = 1200;
      const rainVertices = new Float32Array(rainCount * 2 * 3);
      const rainSpeeds = new Float32Array(rainCount);

      function resetDrop(i, initial) {
        const idx = i * 6;
        const x = (Math.random() - 0.5) * 30;
        const z = (Math.random() - 0.5) * 30;
        const y = initial ? Math.random() * 20 : 15 + Math.random() * 8;
        rainVertices[idx] = x;
        rainVertices[idx + 1] = y + 0.6;
        rainVertices[idx + 2] = z;
        rainVertices[idx + 3] = x;
        rainVertices[idx + 4] = y;
        rainVertices[idx + 5] = z;
      }
      for (let i = 0; i < rainCount; i++) {
        resetDrop(i, true);
        rainSpeeds[i] = 0.12 + Math.random() * 0.15;
      }

      const rainLineGeo = new THREE.BufferGeometry();
      rainLineGeo.setAttribute('position', new THREE.BufferAttribute(rainVertices, 3));
      const rainLines = new THREE.LineSegments(
        rainLineGeo,
        new THREE.LineBasicMaterial({ color: 0x99aacc, transparent: true, opacity: 0.3 })
      );
      scene.add(rainLines);

      // --- 遠くの街灯 ---
      const streetLampMat = new THREE.MeshStandardMaterial({
        color: 0xffeeaa,
        emissive: new THREE.Color(0xffaa44),
        emissiveIntensity: 2.0,
      });
      for (let i = 0; i < 6; i++) {
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), streetLampMat);
        lamp.position.set(-8 + i * 3.5, 2.5, -12);
        scene.add(lamp);

        const glow = new THREE.Sprite(
          new THREE.SpriteMaterial({ color: 0xffaa55, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending })
        );
        glow.scale.set(1.2, 1.2, 1);
        glow.position.copy(lamp.position);
        scene.add(glow);
      }

      // 遠くのビル窓
      const windowMat = new THREE.MeshStandardMaterial({
        color: 0xaaccff,
        emissive: new THREE.Color(0x88aaff),
        emissiveIntensity: 1.0,
      });
      for (let i = 0; i < 20; i++) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.1), windowMat);
        win.position.set(
          (Math.random() - 0.5) * 40,
          2 + Math.random() * 8,
          -15 - Math.random() * 10
        );
        scene.add(win);
      }

      // --- アニメーション ---
      function animate() {
        requestAnimationFrame(animate);
        const t = performance.now() * 0.001;

        // 雨の落下
        for (let i = 0; i < rainCount; i++) {
          const idx = i * 6;
          const speed = rainSpeeds[i] * 0.8;
          rainVertices[idx + 1] -= speed;
          rainVertices[idx + 4] -= speed;
          if (rainVertices[idx + 4] < 0) resetDrop(i, false);
        }
        rainLineGeo.attributes.position.needsUpdate = true;

        // 明滅
        signBoardMat.emissiveIntensity = 0.9 + Math.sin(t * 8) * 0.05;
        signLight.intensity = 1.0 + Math.sin(t * 5) * 0.2;
        vendingLight.intensity = 0.5 + Math.sin(t * 12) * 0.1;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // --- リサイズ ---
      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 自動回転の一時停止・再開
      const pauseRotate = function () { controls.autoRotate = false; };
      const resumeRotate = function () {
        setTimeout(function () { controls.autoRotate = true; }, 4000);
      };
      renderer.domElement.addEventListener('mousedown', pauseRotate);
      renderer.domElement.addEventListener('mouseup', resumeRotate);
      renderer.domElement.addEventListener('touchstart', pauseRotate);
      renderer.domElement.addEventListener('touchend', resumeRotate);
    })();
  </script>
</body>
</html>
