<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainy Night Convenience Store - Assembly Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0a0f1a;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========== 基础设置 ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);
    scene.fog = new THREE.Fog(0x0b0e14, 25, 65);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(14, 9, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 6;
    controls.maxDistance = 40;
    controls.update();

    // ========== 灯光 ==========
    const ambientLight = new THREE.AmbientLight(0x404c6b, 0.55);
    scene.add(ambientLight);

    const streetLight1 = new THREE.PointLight(0x7d9cd6, 0.8, 30);
    streetLight1.position.set(5, 8, 5);
    scene.add(streetLight1);

    const streetLight2 = new THREE.PointLight(0x7d9cd6, 0.6, 25);
    streetLight2.position.set(-6, 7, -4);
    scene.add(streetLight2);

    const storeLight1 = new THREE.PointLight(0xffdd99, 1.2, 15);
    storeLight1.position.set(0, 4, 1.5);
    scene.add(storeLight1);

    const storeLight2 = new THREE.PointLight(0xffaa66, 0.9, 12);
    storeLight2.position.set(-2, 4, -1);
    scene.add(storeLight2);

    const storeLight3 = new THREE.PointLight(0xffaa66, 0.9, 12);
    storeLight3.position.set(2.5, 4, -1);
    scene.add(storeLight3);

    const signLight = new THREE.PointLight(0xffaa55, 0.7, 10);
    signLight.position.set(1.5, 4.5, 3.2);
    scene.add(signLight);

    const backLight = new THREE.DirectionalLight(0x556688, 0.4);
    backLight.position.set(-5, 5, -8);
    scene.add(backLight);

    const fillLight = new THREE.DirectionalLight(0xccddff, 0.15);
    fillLight.position.set(2, 3, 6);
    scene.add(fillLight);

    // ========== 动画辅助 ==========
    // 每个元素记录一个 userData.appearTime (秒)，模型从0开始出现
    const appearObjects = [];
    let assemblyStart = 0;
    const ASSEMBLY_DURATION = 4.0; // 总组装时长（秒）
    let assemblyActive = true;
    const clock = new THREE.Clock();

    // 辅助函数：注册出现动画
    function registerAppear(object, delay, duration = 0.8, dropHeight = 1.5) {
      object.userData.appear = {
        delay: delay,
        duration: duration,
        dropHeight: dropHeight,
        originalY: object.position.y,
        originalScale: object.scale.clone(),
        originalRotX: object.rotation.x,
        originalRotY: object.rotation.y,
        originalRotZ: object.rotation.z
      };
      // 初始状态隐藏（透明、下沉、缩小）
      object.position.y = object.userData.appear.originalY - dropHeight;
      object.scale.set(0.01, 0.01, 0.01);
      object.visible = true;
      appearObjects.push(object);
    }

    // ========== 底座 ==========
    const baseSize = 14;
    const baseGroup = new THREE.Group();
    scene.add(baseGroup);

    const baseGeo = new THREE.BoxGeometry(baseSize, 0.3, baseSize);
    const baseMat = new THREE.MeshStandardMaterial({
      color: 0x1a1e28, roughness: 0.3, metalness: 0.2,
      emissive: new THREE.Color(0x0a0c10), emissiveIntensity: 0.2
    });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.set(0, -0.15, 0);
    base.receiveShadow = true;
    base.castShadow = true;
    baseGroup.add(base);

    // 底座描边
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x3a4a6a });
    const edgePoints = [
      [-baseSize/2, 0.02, -baseSize/2], [baseSize/2, 0.02, -baseSize/2],
      [baseSize/2, 0.02, baseSize/2], [-baseSize/2, 0.02, baseSize/2],
      [-baseSize/2, 0.02, -baseSize/2]
    ].map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const edgeGeometry = new THREE.BufferGeometry().setFromPoints(edgePoints);
    const edgeLine = new THREE.Line(edgeGeometry, edgeMat);
    baseGroup.add(edgeLine);

    // 注册底座出现
    registerAppear(baseGroup, 0.0, 1.0, 2.0);
    // 但底座是地面，不应该从下沉出现太奇怪，重新调整：让底座从y=-3上升
    baseGroup.userData.appear.originalY = 0;
    baseGroup.position.y = -3;
    baseGroup.scale.set(0.01, 0.01, 0.01);

    // ========== 路面细节 ==========
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    // 斑马线
    const stripeMat = new THREE.MeshStandardMaterial({
      color: 0xaaccff, emissive: new THREE.Color(0x224466), emissiveIntensity: 0.3,
      transparent: true, opacity: 0.35, roughness: 0.2, metalness: 0.1
    });
    for (let i = -1; i <= 1; i++) {
      const stripeGeo = new THREE.BoxGeometry(1.8, 0.02, 0.25);
      const stripe = new THREE.Mesh(stripeGeo, stripeMat);
      stripe.position.set(i * 2.5, 0.02, 3.5);
      stripe.rotation.y = 0.2;
      roadGroup.add(stripe);
    }

    // 排水沟
    const drainMat = new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.7, metalness: 0.5 });
    const drain = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.6), drainMat);
    drain.position.set(4.5, 0.03, -4);
    roadGroup.add(drain);

    // 积水
    const puddleMat = new THREE.MeshStandardMaterial({
      color: 0x88aadd, emissive: new THREE.Color(0x112233), emissiveIntensity: 0.6,
      transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.8
    });
    const puddlePositions = [[-3, 0.02, 2.5], [2.5, 0.02, -2], [4, 0.02, 4], [-4.5, 0.02, -3], [0.5, 0.02, 4.5]];
    puddlePositions.forEach(pos => {
      const puddleGeo = new THREE.CircleGeometry(0.7 + Math.random()*0.5, 8);
      const puddle = new THREE.Mesh(puddleGeo, puddleMat);
      puddle.position.set(pos[0], pos[1], pos[2]);
      puddle.rotation.x = -Math.PI / 2;
      roadGroup.add(puddle);
    });

    // 停车位标线
    const parkLineMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, transparent: true, opacity: 0.4 });
    const parkLine1 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.02, 0.1), parkLineMat);
    parkLine1.position.set(-1.0, 0.03, -5.0);
    roadGroup.add(parkLine1);
    const parkLine2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.02, 0.1), parkLineMat);
    parkLine2.position.set(1.0, 0.03, -5.0);
    roadGroup.add(parkLine2);

    registerAppear(roadGroup, 0.2, 0.6, 0.5);

    // ========== 便利店建筑 ==========
    const storeGroup = new THREE.Group();
    scene.add(storeGroup);

    // 材质
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5, emissive: new THREE.Color(0x222222), emissiveIntensity: 0.1 });
    const wallDarkMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.6 });
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0xaaccff, transparent: true, opacity: 0.25, roughness: 0.1, metalness: 0.1,
      emissive: new THREE.Color(0x112233), emissiveIntensity: 0.3, side: THREE.DoubleSide
    });

    // 墙体
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 0.3), wallDarkMat);
    backWall.position.set(0, 1.75, -2.5);
    backWall.castShadow = true;
    backWall.receiveShadow = true;
    storeGroup.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.5, 5), wallMat);
    leftWall.position.set(-3, 1.75, 0);
    leftWall.castShadow = true;
    leftWall.receiveShadow = true;
    storeGroup.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.5, 5), wallMat);
    rightWall.position.set(3, 1.75, 0);
    rightWall.castShadow = true;
    rightWall.receiveShadow = true;
    storeGroup.add(rightWall);

    // 屋顶
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7, emissive: new THREE.Color(0x111111), emissiveIntensity: 0.1 });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.2, 5.2), roofMat);
    roof.position.set(0, 3.6, 0);
    roof.castShadow = true;
    roof.receiveShadow = true;
    storeGroup.add(roof);

    // 前玻璃窗
    const glassLeft = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.8, 0.1), glassMat);
    glassLeft.position.set(-1.7, 1.7, 2.45);
    storeGroup.add(glassLeft);

    // 自动门组
    const doorGroup = new THREE.Group();
    const doorGlass = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 0.1), glassMat);
    doorGlass.position.set(0, 1.5, 0);
    doorGroup.add(doorGlass);

    const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4, metalness: 0.6 });
    const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 0.15), doorFrameMat);
    doorFrame.position.set(0, 2.85, 0.02);
    doorGroup.add(doorFrame);
    const doorFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.7, 0.15), doorFrameMat);
    doorFrameLeft.position.set(-0.95, 1.45, 0.02);
    doorGroup.add(doorFrameLeft);
    const doorFrameRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.7, 0.15), doorFrameMat);
    doorFrameRight.position.set(0.95, 1.45, 0.02);
    doorGroup.add(doorFrameRight);
    doorGroup.position.set(1.5, 0, 2.45);
    storeGroup.add(doorGroup);

    // 下墙
    const lowerWall = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 0.3), wallMat);
    lowerWall.position.set(0, 0.15, 2.45);
    lowerWall.castShadow = true;
    lowerWall.receiveShadow = true;
    storeGroup.add(lowerWall);

    // 分隔条
    const dividerMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
    const divider1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.8, 0.12), dividerMat);
    divider1.position.set(-0.6, 1.7, 2.46);
    storeGroup.add(divider1);
    const divider2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.8, 0.12), dividerMat);
    divider2.position.set(0.2, 1.7, 2.46);
    storeGroup.add(divider2);

    // 招牌
    const signBoardMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: new THREE.Color(0xffaa55), emissiveIntensity: 1.2, roughness: 0.2
    });
    const signBoard = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.7, 0.3), signBoardMat);
    signBoard.position.set(0, 3.95, 2.4);
    signBoard.castShadow = true;
    storeGroup.add(signBoard);

    const signStripeMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: new THREE.Color(0xff4400), emissiveIntensity: 1.0 });
    for (let i = 0; i < 3; i++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.05), signStripeMat);
      stripe.position.set(-1.2 + i * 1.2, 3.95, 2.56);
      storeGroup.add(stripe);
    }

    const signLampMat = new THREE.MeshStandardMaterial({ color: 0xffeeaa, emissive: new THREE.Color(0xffaa33), emissiveIntensity: 1.5 });
    const signLamp = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), signLampMat);
    signLamp.position.set(1.5, 4.3, 2.3);
    storeGroup.add(signLamp);

    // 雨棚
    const awningMat = new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.6 });
    const awning = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.1, 1.2), awningMat);
    awning.position.set(0, 3.15, 3.0);
    awning.castShadow = true;
    awning.receiveShadow = true;
    storeGroup.add(awning);

    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 });
    const pillar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.1, 6), pillarMat);
    pillar1.position.set(-2.8, 1.55, 3.4);
    pillar1.castShadow = true;
    pillar1.receiveShadow = true;
    storeGroup.add(pillar1);
    const pillar2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.1, 6), pillarMat);
    pillar2.position.set(2.8, 1.55, 3.4);
    pillar2.castShadow = true;
    pillar2.receiveShadow = true;
    storeGroup.add(pillar2);

    // 注册建筑出现（延迟稍长，因为要“搭建”）
    // 墙体部分逐个出现
    const wallParts = [backWall, leftWall, rightWall, roof, glassLeft, doorGroup, lowerWall, divider1, divider2, signBoard, awning, pillar1, pillar2];
    wallParts.forEach((part, idx) => {
      if (part === doorGroup) {
        // 门组单独处理，避免它被隐藏导致玻璃消失？但门组作为整体需要出现
        registerAppear(part, 1.0 + idx * 0.08, 0.6, 1.2);
      } else {
        registerAppear(part, 1.0 + idx * 0.08, 0.6, 1.2);
      }
    });
    // 招牌条纹和灯也加入
    storeGroup.children.forEach(child => {
      if (!child.userData.appear && child !== storeGroup) {
        // 对未注册的，补充注册
        if (!appearObjects.includes(child) && child.parent === storeGroup) {
          registerAppear(child, 1.0 + Math.random() * 0.8, 0.5, 0.8);
        }
      }
    });

    // 修正：storeGroup本身不需要注册，但子对象已经注册，storeGroup的位置不应改变
    // 但storeGroup直接添加到scene，它自身位置(0,0,0)不受影响

    // 内部陈设单独组
    const interiorGroup = new THREE.Group();
    storeGroup.add(interiorGroup);

    const floorMat = new THREE.MeshStandardMaterial({ color: 0xccbbaa, roughness: 0.8, emissive: new THREE.Color(0x443322), emissiveIntensity: 0.2 });
    const interiorFloor = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.1, 4.8), floorMat);
    interiorFloor.position.set(0, 0.05, 0);
    interiorFloor.receiveShadow = true;
    interiorGroup.add(interiorFloor);

    const innerWallMat = new THREE.MeshStandardMaterial({ color: 0xeeddcc, roughness: 0.8 });
    const innerBack = new THREE.Mesh(new THREE.BoxGeometry(5.8, 3.2, 0.1), innerWallMat);
    innerBack.position.set(0, 1.7, -2.4);
    innerBack.receiveShadow = true;
    interiorGroup.add(innerBack);

    // 货架
    const shelfMat = new THREE.MeshStandardMaterial({ color: 0xbbaa99, roughness: 0.7 });
    const shelf1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 2.5), shelfMat);
    shelf1.position.set(-2.2, 0.9, -0.5);
    shelf1.castShadow = true;
    shelf1.receiveShadow = true;
    interiorGroup.add(shelf1);

    const colors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff];
    for (let i = 0; i < 12; i++) {
      const itemMat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], emissive: new THREE.Color(colors[i % colors.length]).multiplyScalar(0.3) });
      const item = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.15), itemMat);
      item.position.set(-2.2 + (Math.random() - 0.5) * 0.5, 0.4 + Math.floor(i / 4) * 0.5, -1.2 + (i % 4) * 0.7);
      item.castShadow = true;
      item.receiveShadow = true;
      interiorGroup.add(item);
    }

    const shelf2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 2.5), shelfMat);
    shelf2.position.set(2.2, 0.9, -0.5);
    shelf2.castShadow = true;
    shelf2.receiveShadow = true;
    interiorGroup.add(shelf2);
    for (let i = 0; i < 12; i++) {
      const itemMat = new THREE.MeshStandardMaterial({ color: colors[(i+2) % colors.length], emissive: new THREE.Color(colors[(i+2) % colors.length]).multiplyScalar(0.3) });
      const item = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.15), itemMat);
      item.position.set(2.2 + (Math.random() - 0.5) * 0.5, 0.4 + Math.floor(i / 4) * 0.5, -1.2 + (i % 4) * 0.7);
      item.castShadow = true;
      item.receiveShadow = true;
      interiorGroup.add(item);
    }

    // 收银台
    const counterMat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.6 });
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.9, 0.8), counterMat);
    counter.position.set(0, 0.45, -1.6);
    counter.castShadow = true;
    counter.receiveShadow = true;
    interiorGroup.add(counter);

    const registerMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.5 });
    const register = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.4), registerMat);
    register.position.set(0.5, 1.0, -1.6);
    register.castShadow = true;
    register.receiveShadow = true;
    interiorGroup.add(register);

    const coffeeMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: new THREE.Color(0x442200), emissiveIntensity: 0.5 });
    const coffee = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4), coffeeMat);
    coffee.position.set(-0.6, 0.9, -1.5);
    coffee.castShadow = true;
    coffee.receiveShadow = true;
    interiorGroup.add(coffee);

    // 杂志架
    const magMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
    const magRack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.3), magMat);
    magRack.position.set(-1.2, 0.5, 1.8);
    magRack.castShadow = true;
    magRack.receiveShadow = true;
    interiorGroup.add(magRack);
    for (let i = 0; i < 4; i++) {
      const magColor = colors[i % colors.length];
      const magItemMat = new THREE.MeshStandardMaterial({ color: magColor, emissive: new THREE.Color(magColor).multiplyScalar(0.2) });
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.08), magItemMat);
      mag.position.set(-1.6 + i * 0.3, 0.65, 1.8);
      mag.rotation.z = 0.1;
      mag.castShadow = true;
      mag.receiveShadow = true;
      interiorGroup.add(mag);
    }

    // 饮料柜
    const coolerMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, emissive: new THREE.Color(0x224466), emissiveIntensity: 0.6 });
    const cooler = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.0, 0.3), coolerMat);
    cooler.position.set(-1.2, 1.0, -2.2);
    cooler.castShadow = true;
    cooler.receiveShadow = true;
    interiorGroup.add(cooler);
    for (let i = 0; i < 6; i++) {
      const bottleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0xaaaaaa), emissiveIntensity: 0.5 });
      const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 6), bottleMat);
      bottle.position.set(-1.8 + i * 0.24, 0.7, -2.05);
      bottle.castShadow = true;
      bottle.receiveShadow = true;
      interiorGroup.add(bottle);
    }

    // 关东煮柜
    const hotMat = new THREE.MeshStandardMaterial({ color: 0xaa8866, emissive: new THREE.Color(0x552200), emissiveIntensity: 0.6 });
    const hotCase = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.5), hotMat);
    hotCase.position.set(1.2, 0.9, -1.2);
    hotCase.castShadow = true;
    hotCase.receiveShadow = true;
    interiorGroup.add(hotCase);

    // 内部吊灯
    const lampMat = new THREE.MeshStandardMaterial({ color: 0xffeeaa, emissive: new THREE.Color(0xffcc66), emissiveIntensity: 2.0 });
    const lamp1 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), lampMat);
    lamp1.position.set(-1.5, 3.0, 0);
    interiorGroup.add(lamp1);
    const lamp2 = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), lampMat);
    lamp2.position.set(1.5, 3.0, 0);
    interiorGroup.add(lamp2);

    // 内部元素也注册出现（比外墙稍晚，先有墙再有内部）
    interiorGroup.children.forEach((child, idx) => {
      registerAppear(child, 1.6 + idx * 0.04, 0.5, 0.8);
    });

    // ========== 街道元素 ==========
    // 自动贩卖机
    const vendingGroup = new THREE.Group();
    const vendingBodyMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, emissive: new THREE.Color(0x441111), emissiveIntensity: 0.6, roughness: 0.4 });
    const vendingBody = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.8), vendingBodyMat);
    vendingBody.position.set(0, 1.1, 0);
    vendingBody.castShadow = true;
    vendingBody.receiveShadow = true;
    vendingGroup.add(vendingBody);

    const panelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0xffdd88), emissiveIntensity: 1.0 });
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.1), panelMat);
    panel.position.set(0, 1.5, 0.45);
    vendingGroup.add(panel);
    vendingGroup.position.set(4.2, 0, 1.5);
    vendingGroup.rotation.y = -0.2;
    scene.add(vendingGroup);
    registerAppear(vendingGroup, 2.2, 0.6, 1.5);

    // 自行车
    const bikeGroup = new THREE.Group();
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3366aa, roughness: 0.5 });
